[project]
name = "memento"
version = "0.0.1"
description = "RAG local sur les Pensées de Marc Aurèle"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []


[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memento"]

[tool.pytest.ini_options]
testpaths = ["tests"]
